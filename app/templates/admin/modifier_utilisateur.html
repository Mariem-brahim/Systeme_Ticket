{% extends 'base.html' %}
{% block title %}Modifier le compte{% endblock %}

{% block content %}
<div class="page-wrapper">
  <div class="page-header">
    <h1>Modifier le compte</h1>
    <p>{{ user.prenom }} {{ user.nom }} — {{ user.email }}</p>
  </div>

  <div class="card" style="max-width:640px;">
    <div class="card-header">Informations du compte</div>
    <div class="card-body">
      <form method="POST"
            action="{{ url_for('admin.modifier_utilisateur', uid=user.id_utilisateur) }}">
        <div class="form-row">
          <div class="form-group">
            <label for="prenom">Prénom <span style="color:var(--danger)">*</span></label>
            <input type="text" id="prenom" name="prenom" class="form-control"
                   value="{{ user.prenom }}" required>
          </div>
          <div class="form-group">
            <label for="nom">Nom <span style="color:var(--danger)">*</span></label>
            <input type="text" id="nom" name="nom" class="form-control"
                   value="{{ user.nom }}" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email <span style="color:var(--danger)">*</span></label>
          <input type="email" id="email" name="email" class="form-control"
                 value="{{ user.email }}" required>
          <small class="text-muted">Modifiez l'adresse email de connexion de cet utilisateur.</small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="telephone">Téléphone</label>
            <input type="text" id="telephone" name="telephone" class="form-control"
                   value="{{ user.telephone or '' }}">
          </div>
          <div class="form-group">
            <label for="role-select">Rôle <span style="color:var(--danger)">*</span></label>
            <select id="role-select" name="role" class="form-control" required>
              {% for r in ['utilisateur', 'technicien', 'directeur', 'administrateur'] %}
                <option value="{{ r }}" {% if user.role == r %}selected{% endif %}>
                  {{ r|capitalize }}
                </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Spécialité (visible uniquement si technicien) -->
        <div class="form-group" id="specialite-group"
             style="display:{% if user.role == 'technicien' %}block{% else %}none{% endif %};">
          <label for="specialite">Spécialité</label>
          <select id="specialite" name="specialite" class="form-control">
            <option value="" disabled>— Sélectionner —</option>
            {% for s in ['Réseaux', 'Sécurité', 'Système', 'Support'] %}
              <option value="{{ s }}" {% if user.specialite == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="mot_de_passe">Nouveau mot de passe</label>
          <div class="input-password-wrapper">
            <input type="password" id="mot_de_passe" name="mot_de_passe" class="form-control"
                   placeholder="Laisser vide pour ne pas changer">
            <button type="button" class="btn-toggle-password" aria-label="Afficher">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
            <input type="checkbox" name="actif" value="1"
                   {% if user.actif %}checked{% endif %}
                   style="width:auto;">
            Compte actif
          </label>
        </div>

        <div class="divider"></div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
          <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
